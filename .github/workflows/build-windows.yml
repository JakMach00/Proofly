name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Small package, needs the .NET Desktop Runtime 8 or newer on the machine.
      - name: Publish
        run: dotnet publish Proofly.csproj -c Release -o publish/standard

      # Large package that carries its own runtime and needs nothing installed.
      - name: Publish with the runtime included
        run: dotnet publish Proofly.csproj -c Release -o publish/self-contained --self-contained true

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish\standard\* -DestinationPath "Proofly-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish\self-contained\* -DestinationPath "Proofly-${{ github.ref_name }}-win-x64-self-contained.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Proofly-*.zip
