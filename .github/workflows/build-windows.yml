name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Small package, needs the .NET Desktop Runtime 8 or newer on the machine.
      - name: Publish
        run: dotnet publish Proofly.csproj -c Release -o publish/standard

      # Large package that carries its own runtime and needs nothing installed.
      - name: Publish with the runtime included
        run: dotnet publish Proofly.csproj -c Release -o publish/self-contained --self-contained true

      # The recording library needs the Visual C++ runtime. Its files go next
      # to the application, so nothing has to be installed on the target machine.
      - name: Add the Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $crt = Get-ChildItem -Path "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "The Visual C++ runtime files were not found on the build machine." }
          Copy-Item "$($crt.FullName)\*.dll" publish\standard\
          Copy-Item "$($crt.FullName)\*.dll" publish\self-contained\
          Write-Host "Added from $($crt.FullName):"
          Get-ChildItem "$($crt.FullName)\*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish\standard\* -DestinationPath "Proofly-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish\self-contained\* -DestinationPath "Proofly-${{ github.ref_name }}-win-x64-self-contained.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Proofly-*.zip
